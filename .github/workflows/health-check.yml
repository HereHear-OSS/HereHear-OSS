name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Service
        run: |
          if ! curl -fL --max-time 15 https://here-hear-ot16p8c0o-tangtangcucu.vercel.app/; then
            echo "Service is down!"
          else
            echo "Service is healthy!"
          fi
