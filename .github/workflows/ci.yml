name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # LTS version matching the locally verified runtime.
          node-version: '24.22.1'
          # Week 7 baseline: explicitly disable automatic npm caching.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # Verbose output lists executed tests and keeps TODOs visible.
        run: npm test -- --reporter=verbose

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Chromium)
        run: npm run test:e2e -- --reporter=list

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: herehear-dist
          path: dist/
          if-no-files-found: error
