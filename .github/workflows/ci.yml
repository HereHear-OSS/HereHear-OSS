name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/week7-8-cicd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # LTS version matching the locally verified runtime.
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: herehear-dist
          path: dist/
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: herehear-dist
          path: dist/

      - name: Verify build artifact
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const html = fs.readFileSync("dist/index.html", "utf8");
            assert.ok(html.includes("id=\"root\""), "Missing React root");
            const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^\"]+)"/g)]
              .map((match) => match[1]);
            assert.ok(assets.some((asset) => asset.endsWith(".js")), "Missing JavaScript bundle reference");
            assert.ok(assets.some((asset) => asset.endsWith(".css")), "Missing CSS bundle reference");
            for (const asset of assets) {
              const file = fs.statSync(`dist${asset}`);
              assert.ok(file.isFile() && file.size > 0, `Invalid asset: ${asset}`);
            }
            console.log(`Build artifact verified: index.html and ${assets.length} referenced assets`);
          '

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Chromium)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:e2e -- --reporter=list

  deploy:
    name: Deploy Vercel Preview
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/week7-8-cicd'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # Must identify the existing herehear-cicd-practice project.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Deploy Preview and record URL
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID variable is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID variable is required}"
          # Deploy source: Vercel builds using the linked project's Preview settings.
          # The CI dist artifact is not Vercel Build Output API (.vercel/output).
          npx --yes vercel@latest deploy --yes --target=preview --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-preview-url.txt"
          deployment_url=$(tr -d '\r\n' < "$RUNNER_TEMP/vercel-preview-url.txt")
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app/?$ ]]; then
            echo "Vercel did not return a valid Preview deployment URL" >&2
            exit 1
          fi
          printf '### Vercel Preview — herehear-cicd-practice\n\n[Open Preview](%s)\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
