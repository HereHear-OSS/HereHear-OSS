name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/week7-8-cicd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed deployment files
        id: detect
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args])

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          eligible = (
              os.environ["GITHUB_EVENT_NAME"] == "push"
              and os.environ["GITHUB_REF"] == "refs/heads/feature/week7-8-cicd"
          )
          deploy = False
          reason = "Skipped: only pushes to feature/week7-8-cicd can deploy (not PR or manual runs)."
          if eligible:
              head = event["after"]
              base = event.get("before", "")
              try:
                  if not base or set(base) == {"0"}:
                      # First push: compare branch changes against its default-branch ancestor.
                      default = event["repository"]["default_branch"]
                      base = git("merge-base", head, f"refs/remotes/origin/{default}").decode().strip()
                  # Compare full push endpoints, including renames/deletions and all commits.
                  files = git("diff", "--no-renames", "--name-only", "-z", base, head).decode().split("\0")
                  exact = {"index.html", "package.json", "package-lock.json", ".env.example", ".npmrc", "vercel.json", ".vercelignore"}
                  def deployment_file(path):
                      return (
                          path in exact
                          or path.startswith(("src/", "public/", "supabase/", ".github/actions/"))
                          or path == ".github/workflows/ci.yml"
                          or path.startswith(("vite.config.", "vercel.config."))
                      )
                  count = sum(deployment_file(path) for path in files if path)
                  deploy = count > 0
                  reason = (
                      f"Eligible: {count} deployment-related files changed; Build and all Matrix tests must pass."
                      if deploy else "Skipped: no deployment-related changes (documentation/test/tooling-only changes)."
                  )
              except (subprocess.CalledProcessError, KeyError):
                  # Force-pushed/unavailable history must not silently suppress an app deployment.
                  deploy = True
                  reason = "Eligible: comparison history unavailable; conservatively deploy after successful checks."
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"deploy={str(deploy).lower()}\nreason={reason}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Preview change detection\n\n{reason}\n")
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          # LTS version matching the locally verified runtime.
          node-version: '24.22.1'

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: herehear-dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    uses: ./.github/workflows/reusable-test.yml

  deploy:
    name: Deploy Vercel Preview
    needs: [build, test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/week7-8-cicd' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      # Must identify the existing herehear-cicd-practice project.
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Deploy Preview and record URL
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?VERCEL_TOKEN secret is required}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID variable is required}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID variable is required}"
          # Deploy source: Vercel builds using the linked project's Preview settings.
          # The CI dist artifact is not Vercel Build Output API (.vercel/output).
          npx --yes vercel@latest deploy --yes --target=preview --token "$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-preview-url.txt"
          deployment_url=$(tr -d '\r\n' < "$RUNNER_TEMP/vercel-preview-url.txt")
          if [[ ! "$deployment_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app/?$ ]]; then
            echo "Vercel did not return a valid Preview deployment URL" >&2
            exit 1
          fi
          printf '### Vercel Preview — herehear-cicd-practice\n\n[Open Preview](%s)\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"

  deployment-summary:
    name: Explain deployment result
    needs: [changes, build, test, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment decision
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          CHANGE_REASON: ${{ needs.changes.outputs.reason }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          {
            printf '### Preview deployment result\n\n'
            printf 'Change detection: %s\n\n' "$CHANGE_RESULT"
            printf '%s\n\n' "$CHANGE_REASON"
            printf 'Build: %s; Test Matrix: %s; Deploy: %s\n\n' "$BUILD_RESULT" "$TEST_RESULT" "$DEPLOY_RESULT"
            if [[ "$BUILD_RESULT" != success || "$TEST_RESULT" != success ]]; then
              printf 'Deployment requires successful Build and every Test Matrix combination.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
