name: Reusable Test Matrix

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: herehear-dist
          path: dist/

      - name: Verify build artifact
        shell: bash
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const html = fs.readFileSync("dist/index.html", "utf8");
            assert.ok(html.includes("id=\"root\""), "Missing React root");
            const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^\"]+)"/g)]
              .map((match) => match[1]);
            assert.ok(assets.some((asset) => asset.endsWith(".js")), "Missing JavaScript bundle reference");
            assert.ok(assets.some((asset) => asset.endsWith(".css")), "Missing CSS bundle reference");
            for (const asset of assets) {
              const file = fs.statSync(`dist${asset}`);
              assert.ok(file.isFile() && file.size > 0, `Invalid asset: ${asset}`);
            }
            console.log(`Build artifact verified: index.html and ${assets.length} referenced assets`);
          '

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Install Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Chromium)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:e2e -- --reporter=list
